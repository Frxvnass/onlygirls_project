{% extends 'shop/base.html' %}

{% block title %}Buyurtma berish | OnlyGirls{% endblock %}

{% block content %}
<h1 class="page-title">Buyurtmani rasmiylashtirish</h1>

<p class="cart-total" style="text-align:center;">Jami: {{ cart.get_total_price }} so'm</p>

<form method="post" class="checkout-form">
    {% csrf_token %}
    <label for="phone_number">Telefon raqamingiz</label>
    <input type="text" name="phone_number" id="phone_number" placeholder="+998 90 123 45 67" required>

    <label for="address">Manzilingiz</label>
    <textarea name="address" id="address" rows="3" placeholder="Yetkazib berish manzili"></textarea>

    <button type="submit" class="btn">Buyurtmani tasdiqlash</button>
</form>
{% endblock %}
