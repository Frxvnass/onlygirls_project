databases:
  - name: onlygirls-db
    databaseName: onlygirls
    user: onlygirls
    plan: free

services:
  - type: web
    name: onlygirls
    runtime: python
    plan: free
    # createsuperuser bepul tarifda shell yo'qligi uchun shu yerda ishlaydi;
    # admin allaqachon mavjud bo'lsa xato bermasin deb "|| true" qo'yilgan.
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && (python manage.py createsuperuser --noinput || true)"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: onlygirls-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: WEB_CONCURRENCY
        value: "2"
      # Quyidagilarni Render panelida o'zingiz to'ldirasiz.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
