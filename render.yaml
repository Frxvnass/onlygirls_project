databases:
  - name: onlygirls-db
    databaseName: onlygirls
    user: onlygirls
    plan: free

services:
  - type: web
    name: onlygirls
    runtime: python
    plan: free
    # ensure_admin bepul tarifda shell yo'qligi uchun shu yerda ishlaydi:
    # DJANGO_SUPERUSER_* o'zgaruvchilarini o'zgartirib qayta deploy qilsangiz,
    # admin login/paroli ham yangilanadi.
    buildCommand: "pip install -r requirements.txt && python manage.py collectstatic --no-input && python manage.py migrate && python manage.py ensure_admin"
    startCommand: "gunicorn config.wsgi:application"
    envVars:
      - key: DATABASE_URL
        fromDatabase:
          name: onlygirls-db
          property: connectionString
      - key: DJANGO_SECRET_KEY
        generateValue: true
      - key: DJANGO_DEBUG
        value: "False"
      - key: DJANGO_ALLOWED_HOSTS
        value: ".onrender.com"
      - key: DJANGO_CSRF_TRUSTED_ORIGINS
        value: "https://*.onrender.com"
      - key: PYTHON_VERSION
        value: "3.13.4"
      - key: WEB_CONCURRENCY
        value: "2"
      # Quyidagilarni Render panelida o'zingiz to'ldirasiz.
      - key: DJANGO_SUPERUSER_USERNAME
        sync: false
      - key: DJANGO_SUPERUSER_EMAIL
        sync: false
      - key: DJANGO_SUPERUSER_PASSWORD
        sync: false
      - key: EMAIL_HOST_USER
        sync: false
      - key: EMAIL_HOST_PASSWORD
        sync: false
      # Media fayllar uchun S3-uyg'un saqlash (Supabase / B2 / R2 / AWS S3).
      # Bo'sh qoldirilsa rasmlar hosting diskida saqlanadi va deploy'da o'chadi.
      - key: AWS_STORAGE_BUCKET_NAME
        sync: false
      - key: AWS_ACCESS_KEY_ID
        sync: false
      - key: AWS_SECRET_ACCESS_KEY
        sync: false
      - key: AWS_S3_ENDPOINT_URL
        sync: false
      - key: AWS_S3_REGION_NAME
        sync: false
      - key: AWS_S3_CUSTOM_DOMAIN
        sync: false
